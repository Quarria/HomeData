<!doctype html>
<!-- Throwaway UI prototype: homepage handles quick capture and immediate attention. -->
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>家常账 · 家庭费用与待办</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <a class="brand" href="#home"><span class="brand-mark">家</span><span>家常账<small>日常费用与提醒</small></span></a>
      <nav id="desktop-nav" aria-label="主导航"></nav>
      <div class="sidebar-bottom"><div class="family-chip">林间小家 <span>3 位成员</span></div><button class="profile" data-page="profile"><span class="avatar">林</span><span>林然<small>家庭管理员</small></span><span>›</span></button></div>

    <div class="workspace">

      <main id="main" tabindex="-1"></main>
      <footer class="page-footer">家常账</footer>
    </div>
  </div>
  <nav class="bottom-nav" id="mobile-nav" aria-label="手机主导航"></nav>
  <dialog id="dialog"><div id="dialog-content"></div></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
