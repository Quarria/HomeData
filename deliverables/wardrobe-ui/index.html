<script>
const seasonOrder=['春','夏','秋','冬'];
function seasonsOf(value){if(Array.isArray(value))return seasonOrder.filter(s=>value.includes(s));if(value==='四季')return [...seasonOrder];return seasonOrder.filter(s=>String(value||'').includes(s))}function entryChecks(name,values,selected=[]){return values.map(value=>'<label><input type="checkbox" name="'+name+'" value="'+value+'" '+(selected.includes(value)?'checked':'')+'><span>'+value+'</span></label>').join('')}
function seasonText(g){const selected=seasonsOf(g.seasons??g.season);return selected.length===4?'四季':selected.join('、')||'待补充'}
const seed=[{id:1,name:'燕麦色针织衫',cat:'上装',color:'米色',fill:'#d3c3a8',shape:'knit',seasons:['春','秋'],status:'可穿',location:'主卧衣柜 · 上层'}, {id:2,name:'卡其色长风衣',cat:'外套',color:'卡其',fill:'#bbaa8b',shape:'coat',seasons:['春','秋'],status:'可穿',location:'主卧衣柜 · 挂衣区'}, {id:3,name:'直筒牛仔裤',cat:'下装',color:'蓝色',fill:'#657f95',shape:'pants',seasons:['春','夏','秋','冬'],status:'可穿',location:'主卧衣柜 · 抽屉'}, {id:4,name:'白色运动鞋',cat:'鞋',color:'白色',fill:'#f7f5ed',shape:'shoe',seasons:['春','夏','秋','冬'],status:'可穿',location:'玄关鞋柜'}, {id:5,name:'蓝白条纹衬衫',cat:'上装',color:'蓝白',fill:'#f1efea',shape:'shirt',seasons:['春','秋'],status:'清洗中',location:'洗衣篮'}, {id:6,name:'黑色阔腿裤',cat:'下装',color:'黑色',fill:'#41474f',shape:'pants',seasons:['春','夏','秋','冬'],status:'可穿',location:'主卧衣柜 · 抽屉'}, {id:7,name:'深蓝色开衫',cat:'外套',color:'深蓝',fill:'#3c4c63',shape:'knit',seasons:['春','秋'],status:'可穿',location:'主卧衣柜 · 上层'}, {id:8,name:'黑色连衣裙',cat:'连衣裙',color:'黑色',fill:'#414046',shape:'dress',seasons:['春','秋'],status:'已收纳',location:'换季收纳箱'}, {id:9,name:'棕色休闲鞋',cat:'鞋',color:'棕色',fill:'#9c7c61',shape:'shoe',seasons:['春','秋'],status:'可穿',location:'玄关鞋柜'}];
let clothes=JSON.parse(localStorage.getItem('wardrobe-ui-clothes')||'null')||structuredClone(seed);let favorites=JSON.parse(localStorage.getItem('wardrobe-ui-favorites')||'null')||[{key:'base',name:'秋日轻通勤',ids:[1,6,4],reason:'米色针织衫搭配黑色长裤，适合温和的秋日。'}];
clothes=clothes.map(g=>{const {season,...rest}=g;return {...rest,seasons:seasonsOf(g.seasons??season)}});
let state=new URLSearchParams(location.search).get('state')||'garments';let mode=state.startsWith('trip')?'trip':'daily';let tab=state.startsWith('trip')||state==='daily'?'outfits':state==='favorites'?'favorites':'garments';let tripEditing=false;let cat='全部',filterStatus='全部状态',query='',generated=state==='trip-result'||state==='trip-partial',partial=state==='trip-partial',dailyGenerated=true;let selectedLocation='杭州 · 浙江 · 中国',travelStart='2026-10-23',travelDays=state==='trip-partial'?5:3,scene='休闲',lastFocus=null,outfitIdea='';
const view=document.getElementById('view'),overlay=document.getElementById('overlay');const icon=n=>`<svg class="icon" aria-hidden="true"><use href="#i-${n}"/></svg>`;const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const item=id=>clothes.find(g=>g.id===id);function photo(g,badge=true){return `<div class="photo" data-bg="${g.id%3}">${g.image?`<img src="${esc(g.image)}" class="art" style="object-fit:contain" alt="${esc(g.name)}">`:`<svg class="art" style="color:${g.fill}" role="img" aria-label="${esc(g.name)}"><use href="#g-${g.shape}"/></svg>`}${badge&&g.status!=='可穿'?`<span class="badge">${g.status}</span>`:''}</div>`}function persist(){localStorage.setItem('wardrobe-ui-clothes',JSON.stringify(clothes));localStorage.setItem('wardrobe-ui-favorites',JSON.stringify(favorites))}function toast(text){const t=document.getElementById('toast');t.textContent=text;t.hidden=false;clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.hidden=true,2600)}
function showTab(t){tab=t;render();window.scrollTo({top:0,behavior:'instant'})}function render(){document.querySelectorAll('[data-tab]').forEach(b=>{b.classList.toggle('selected',b.dataset.tab===tab);b.setAttribute('aria-current',b.dataset.tab===tab?'page':'false')});view.className='fade';if(tab==='garments')renderGarments();else if(tab==='favorites')renderFavorites();else renderOutfits()}
function renderGarments(){view.innerHTML=`<div class="toolbar"><div class="search">${icon('search')}<input id="search" type="search" value="${esc(query)}" placeholder="搜索名称、颜色或收纳位置" aria-label="搜索衣物" oninput="query=this.value;renderGrid()"></div><div class="selectwrap"><select id="status-filter" aria-label="衣物状态" onchange="filterStatus=this.value;renderGrid()">${['全部状态','可穿','清洗中','已收纳','已退役'].map(s=>`<option ${filterStatus===s?'selected':''}>${s}</option>`).join('')}</select></div><span class="count" id="count"></span></div><div class="filter" aria-label="衣物类别">${['全部','上装','外套','下装','连衣裙','鞋','配饰'].map(c=>`<button class="${cat===c?'on':''}" onclick="cat='${c}';renderGarments()">${c}</button>`).join('')}</div><div class="grid" id="garmentgrid"></div>`;renderGrid()}
function renderGrid(){const rows=clothes.filter(g=>(!g.owner||g.owner==='self')&&(cat==='全部'||g.cat===cat)&&(filterStatus==='全部状态'||g.status===filterStatus)&&[g.name,g.color,g.location].join(' ').includes(query));document.getElementById('count').textContent=`${rows.length} 件衣物`;document.getElementById('garmentgrid').innerHTML=rows.length?rows.map(g=>`<button class="garment" onclick="openDetail(${g.id})">${photo(g)}<h3>${esc(g.name)}</h3><div class="meta">${g.cat} · ${seasonText(g)} · ${g.status}</div></button>`).join(''):'<div class="empty"><h3>没有找到符合条件的衣物</h3><p>试试其他分类或状态。</p><button class="textbutton" onclick="cat=\'全部\';query=\'\';filterStatus=\'全部状态\';renderGarments()">清除筛选</button></div>'}
function outfitItems(ids){return `<div class="outfititems ${ids.length>3?'four':''}">${ids.map(id=>item(id)).filter(Boolean).map(g=>`<button class="garment" onclick="openDetail(${g.id})">${photo(g,false)}<div class="label">${esc(g.name)}</div></button>`).join('')}</div>`}function saveOutfit(key,name,ids,reason){if(favorites.some(f=>f.key===key)){toast('这套搭配已在收藏中');return}favorites.push({key,name,ids,reason});persist();toast('已加入收藏搭配');render()}
function renderFavorites(){view.innerHTML=`<div class="scenehead" style="margin-bottom:20px"><h2>喜欢的组合，下次接着穿</h2><span class="muted small">${favorites.length} 套收藏</span></div><div class="favoritegrid">${favorites.length?favorites.map(f=>`<section class="outfit"><div class="outfithead"><div><h3>${esc(f.name)}</h3><p>个人搭配 · ${f.ids.length} 件单品</p></div><button class="textbutton" onclick="removeFavorite('${f.key}')">取消收藏</button></div>${outfitItems(f.ids)}<div class="reason">${esc(f.reason)}</div>${f.ids.some(id=>!item(id)||item(id).status!=='可穿')?'<p class="small" style="color:var(--accent)">部分单品目前不可穿，请先查看衣物状态。</p>':''}</section>`).join(''):'<div class="empty"><h3>还没有收藏搭配</h3><p>在穿搭推荐中保存一套喜欢的组合。</p><button class="button secondary" onclick="showTab(\'outfits\')">去选搭配</button></div>'}</div>`}function removeFavorite(key){favorites=favorites.filter(f=>f.key!==key);persist();render();toast('已取消收藏')}
function renderOutfits(){view.innerHTML=`<div class="layout"><section class="formpanel ${mode==='trip'&&generated&&!tripEditing?'compact':''}"><div class="compact-summary"><div><strong>${esc(selectedLocation.split(' · ')[0])} · ${travelDays} 天</strong><div class="small muted">${travelStart} 出发 · ${esc(scene)}</div></div><button class="textbutton" onclick="tripEditing=true;renderOutfits()">修改行程</button></div><div class="formbody"><div class="segmented ${mode==='trip'?'travel':''}"><button class="${mode==='daily'?'on':''}" onclick="mode='daily';renderOutfits()">日常穿搭</button><button class="${mode==='trip'?'on':''}" onclick="mode='trip';renderOutfits()">旅行穿搭</button></div>${mode==='trip'?tripForm():dailyForm()}</div></section><section id="results">${mode==='trip'?tripResults():dailyResults()}</section></div>`}
function dailyForm(){return `<h2 style="margin-bottom:18px">今天怎么穿</h2><div class="field"><label for="daily-city">所在城市</label><select id="daily-city"><option>杭州 · 浙江</option></select></div><div class="field"><label for="daily-scene">今天的场景</label><select id="daily-scene"><option>休闲</option><option>通勤</option><option>运动</option></select></div><div class="field"><label for="daily-idea">穿搭想法（选填）</label><textarea id="daily-idea" maxlength="160" placeholder="例如：想叠穿、偏好浅色，今天要通勤" oninput="outfitIdea=this.value;dailyGenerated=false;document.getElementById('results').innerHTML=dailyResults()">${esc(outfitIdea)}</textarea><small>可写偏好、需要叠穿的程度或想避开的衣物；会结合天气、场景和可穿衣物参考。</small></div><button class="button primary full" onclick="generateDaily(this)">生成今日穿搭</button><p class="small muted hint">仅从你当前可穿的衣物中选择。</p><div class="note-line"><span>AI 推荐</span><span>今日剩余 5 次</span></div>`}
function dailyRecommendationIds(){const wantsLayer=/叠穿|外套|分层|保暖/.test(outfitIdea);const avoidsLayer=/(不要|避免|不想|不穿|别).*?(叠穿|外套|分层|保暖)/.test(outfitIdea);return wantsLayer&&!avoidsLayer?[1,2,3,4]:[1,3,4]}
function contextualReason(base){const idea=outfitIdea.trim();return idea?`已结合你的想法“${idea}”筛选可穿衣物。${base}`:base}
function saveDailyOutfit(){const ids=dailyRecommendationIds();const name=ids.length>3?'轻暖叠穿组合':'舒适的秋日组合';saveOutfit('daily',name,ids,contextualReason(ids.length>3?'针织衫作为内搭，风衣应对早晚温差；日间温暖时可脱下外层。':'针织衫应对早晚微凉，牛仔裤和运动鞋适合日常活动。'))}
function dailyResults(){const ids=dailyRecommendationIds();const reason=contextualReason(ids.length>3?'针织衫作为内搭，风衣应对早晚温差；日间温暖时可脱下外层。':'针织衫应对早晚微凉，牛仔裤和运动鞋适合日常活动。风大时可加卡其色风衣。');const title=ids.length>3?'轻暖叠穿组合':'舒适的秋日组合';return `<div class="weatherhead"><div><h2>杭州 · 秋日微凉</h2><p class="muted small">10 月 20 日 · 多云 · 天气更新于 09:20</p></div><div class="degrees">17—23°</div></div><div class="info" style="margin-bottom:20px">早晚有些凉，适合轻薄叠穿，外出可加一件外套。</div>${dailyGenerated?`<section class="outfit"><div class="outfithead"><div><h3>${title}</h3><p>休闲 · ${ids.length} 件单品</p></div><button class="save" onclick="saveDailyOutfit()">${favorites.some(f=>f.key==='daily')?'已收藏':'收藏搭配'}</button></div>${outfitIdea.trim()?`<p class="small muted">已参考你的想法：${esc(outfitIdea.trim())}</p>`:''}${outfitItems(ids)}<div class="reason">${esc(reason)}</div></section>`:'<div class="empty"><h3>选好场景，再选一套合适的衣服</h3><p>生成后会显示单品和搭配理由。</p></div>'}`}
function generateDaily(b){b.disabled=true;b.textContent='正在整理可穿衣物…';setTimeout(()=>{dailyGenerated=true;renderOutfits();toast('今日搭配已整理好')},650)}function tripForm(){return `<h2 style="margin-bottom:18px">带着合适的衣服出发</h2><div class="tripfields"><div class="field"><label for="destination">目的地</label><input id="destination" value="${esc(selectedLocation.split(' · ')[0])}" placeholder="输入城市或区县" oninput="selectedLocation='';document.getElementById('destselected').textContent='请选择明确的目的地';showLocations(this.value)"><div id="destresults"></div><small id="destselected">${esc(selectedLocation)}</small></div><div class="field"><label for="travel-start">出发日期</label><input id="travel-start" type="date" value="${travelStart}" onchange="travelStart=this.value;invalidateTrip()"></div><div class="field"><label for="travel-days">旅行天数</label><input id="travel-days" type="number" min="1" max="30" value="${travelDays}" onchange="travelDays=Number(this.value);invalidateTrip()"><small>出发当天计第 1 天</small></div></div><div class="field"><label for="trip-scene">旅行场景</label><select id="trip-scene" onchange="scene=this.value;invalidateTrip()">${['休闲','通勤','运动'].map(s=>`<option ${scene===s?'selected':''}>${s}</option>`).join('')}</select></div><div class="field"><label for="trip-idea">穿搭想法（选填）</label><textarea id="trip-idea" maxlength="160" placeholder="例如：尽量轻便、需要叠穿、避免浅色" oninput="outfitIdea=this.value;invalidateTrip()">${esc(outfitIdea)}</textarea><small>会参考每天的天气、旅行场景和当前可穿衣物。</small></div><button class="button primary full" id="generate-trip" onclick="generateTrip(this)">生成旅行穿搭</button><p class="small muted hint">目的地天气自动查询，生成时才调用 AI。</p><div class="note-line"><span>整段旅行计 1 次推荐</span><span>今日剩余 5 次</span></div>`}
function showLocations(q){const locations=q.includes('大理')?['大理 · 云南 · 中国']:q.includes('成都')?['成都 · 四川 · 中国']:q.includes('苏州')?['苏州 · 江苏 · 中国']:['杭州 · 浙江 · 中国'];document.getElementById('destresults').innerHTML=q.trim()?`<div class="destresults">${locations.map(l=>`<button onclick="selectLocation('${l}')">${l.split(' · ')[0]}<small>${l.split(' · ').slice(1).join(' · ')}</small></button>`).join('')}</div>`:'';generated=false;document.getElementById('results').innerHTML=tripResults()}
function selectLocation(l){selectedLocation=l;generated=false;renderOutfits();document.getElementById('destination').focus()}function invalidateTrip(){generated=false;document.getElementById('results').innerHTML=tripResults()}
function generateTrip(b){const start=document.getElementById('travel-start');const days=document.getElementById('travel-days');if(!selectedLocation){toast('请从搜索结果中选择目的地');document.getElementById('destination').focus();return}if(!start.value||!days.checkValidity()||!Number.isInteger(Number(days.value))){toast('请填写出发日期和 1—30 天的整数天数');return}travelStart=start.value;travelDays=Number(days.value);b.disabled=true;b.textContent='正在整理目的地天气与衣物…';setTimeout(()=>{generated=true;tripEditing=false;partial=travelDays>3;renderOutfits();if(innerWidth<761)document.getElementById('results').scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth',block:'start'})},700)}
function saveTripOutfit(key,name,ids,reason){saveOutfit(key,name,ids,contextualReason(reason))}function tripResults(){if(!generated)return `<div class="empty"><svg class="icon" style="width:42px;height:42px;color:var(--accent)"><use href="#i-hanger"/></svg><h2 style="margin-top:16px">去哪里，就按那里的天气穿</h2><p style="margin-top:14px">选好目的地和日期，查看每天的天气与衣物搭配。</p><p class="small" style="margin-top:16px">超出预报范围的日期会单独标明。</p></div>`;const date=new Date(travelStart+'T12:00:00');const end=new Date(date);end.setDate(end.getDate()+travelDays-1);const label=d=>`${d.getMonth()+1} 月 ${d.getDate()} 日`;const days=Array.from({length:Math.min(travelDays,5)},(_,i)=>{const d=new Date(date);d.setDate(d.getDate()+i);if(partial&&i>=3)return `<article class="dayrow unavailable"><div class="daydate">${d.getMonth()+1}.${String(d.getDate()).padStart(2,'0')}<span>第 ${i+1} 天</span></div><div class="daycontent"><h3>尚无天气预报</h3><p class="small muted">临近出行时重新生成，或按你提供的天气条件参考搭配。</p><button class="textbutton" onclick="manualWeather(${i})">手选天气条件</button><div id="manual-${i}"></div></div></article>`;const ids=i===1?[1,6,4,2]:i===2?[1,3,9,7]:[1,3,4,2];const weather=['多云 · 17—23℃','小雨 · 15—19℃','晴 · 16—24℃'][i%3];const reasons=['针织衫作为内搭，早晚或风大时加风衣；日间温暖可脱下外层。','针织衫作内搭，外加风衣；小雨天鞋履是否防水请按实物确认。','针织衫搭配开衫，外层方便穿脱；牛仔裤可继续复用。'];const key=`trip-${travelStart}-${i}-${selectedLocation}`;return `<article class="dayrow"><div class="daydate">${d.getMonth()+1}.${String(d.getDate()).padStart(2,'0')}<span>第 ${i+1} 天</span></div><div class="daycontent"><div class="daytop"><strong>${weather}</strong><button class="save" onclick="saveTripOutfit('${key}','${label(d)} · ${selectedLocation.split(' · ')[0]}',[${ids}],'${reasons[i%3]}')">${favorites.some(f=>f.key===key)?'已收藏':'收藏搭配'}</button></div>${outfitItems(ids)}<p class="small muted">${esc(contextualReason(reasons[i%3]))}</p></div></article>`}).join('');return `<div class="tripintro"><div><h2>${esc(selectedLocation.split(' · ')[0])}，${travelDays} 天的穿搭</h2><p class="muted small">${label(date)}—${label(end)} · ${esc(scene)}</p></div><span class="pill">本人衣柜</span></div><div class="info ${partial?'warning':''}">${partial?'部分日期尚无预报，已单独标明。':'早晚温差较大，建议轻薄叠穿。相近天气可复用单品。'}</div><p class="small muted" style="margin-top:10px">目的地当地日期 · 天气更新于 10 月 20 日 09:20</p>${days}${travelDays>5?'<p class="small muted">其余日期暂无预报，请临近出行时重新查看。</p>':''}`}
function manualWeather(i){document.getElementById('manual-'+i).innerHTML=`<div class="field" style="margin-top:14px"><label>参考天气</label><select id="manual-select-${i}"><option>温和 · 15—25℃</option><option>偏冷 · 5—15℃</option></select></div><button class="button secondary" onclick="showManual(${i})">查看参考搭配</button>`}function showManual(i){document.getElementById('manual-'+i).innerHTML=`<p class="small" style="margin-top:12px">依据手动天气条件，不是目的地预报</p>${outfitItems([1,3,4])}`}
function openDrawer(html){lastFocus=document.activeElement;overlay.innerHTML=`<div class="backdrop" onclick="if(event.target===this)closeDrawer()"><section class="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title" tabindex="-1">${html}</section></div>`;document.body.style.overflow='hidden';overlay.querySelector('.close').focus()}function closeDrawer(){overlay.innerHTML='';document.body.style.overflow='';lastFocus?.focus()}function openDetail(id){const g=item(id);if(!g)return;openDrawer(`<div class="drawhead"><h2 id="drawer-title">衣物详情</h2><button class="close" aria-label="关闭详情" onclick="closeDrawer()">×</button></div>${photo(g,false)}<h2 style="margin-top:22px">${esc(g.name)}</h2><p class="small muted">我的衣物</p><div class="properties"><div class="detailrow"><small>添置日期</small>${g.acquiredOn||'未填写'}</div><div class="detailrow"><small>录入方式</small>${g.purchaseMode==='NEW'?'衣物与支出一起录入':g.purchaseMode==='EXISTING'?'关联已有账单':'仅建档'}</div><div class="detailrow"><small>类别</small>${g.cat}</div><div class="detailrow"><small>主色</small>${g.color}</div><div class="detailrow"><small>适用季节</small>${seasonText(g)}</div><div class="detailrow"><small>穿搭建议</small>${esc(g.stylingAdvice||"暂无建议")}</div><div class="detailrow"><small>收纳位置</small>${esc(g.location||'未填写')}</div></div><div class="field"><label for="detail-status">当前状态</label><select id="detail-status" onchange="updateStatus(${g.id},this.value)">${['可穿','清洗中','已收纳','已退役'].map(s=>`<option ${s===g.status?'selected':''}>${s}</option>`).join('')}</select><small>只有“可穿”的衣物会进入自动推荐。</small></div><h3>购买与养护</h3><p class="small muted">${g.purchaseMode==='NEW'?'支出信息：¥ '+esc(g.purchaseAmount)+' · 个人账本（付款人：我）':g.purchaseMode==='EXISTING'?'已选择已有服饰支出，不重复记账。':'尚未关联购买账目；可从已有服饰支出关联。'}</p><div class="actions"><button class="button secondary" onclick="openLinked('expense',${g.id})">关联账目</button><button class="button quiet" onclick="openLinked('task',${g.id})">建立养护待办</button></div><div class="actions"><button class="button primary" onclick="openEntry(${g.id})">编辑衣物</button><button class="textbutton" onclick="deleteGarment(${g.id})">删除衣物</button></div>`)}function updateStatus(id,status){item(id).status=status;persist();render();toast('衣物状态已更新')}function deleteGarment(id){if(!confirm('删除这件衣物？关联账目不会被删除。'))return;clothes=clothes.filter(g=>g.id!==id);persist();closeDrawer();render();toast('衣物已删除')}
function entryPurchaseFields(g){return `<section style="border-bottom:1px solid var(--line);margin-bottom:22px;padding-bottom:6px"><h3 style="margin:0 0 16px">购买与归属</h3><div class="field"><label for="entry-owner">这件衣服给谁</label><select id="entry-owner" name="owner" ${g?'disabled':''} onchange="changeRecipient(this.value)"><option value="self">自己</option><option value="other" ${g?.owner==='other'?'selected':''}>另一位家庭成员</option></select><small id="owner-hint">${g?'衣物所有人不通过普通编辑转移。':'给家人购买时，衣物直接进入对方衣柜，支出仍由我记录。'}</small></div><div class="field"><label for="entry-acquired">添置日期</label><input id="entry-acquired" name="acquiredOn" type="date" value="${g?.acquiredOn||(!g?'2026-10-20':'')}"><small>获得衣物的日期；旧衣不记得时可以留空。</small></div>${g?'<p class="small muted">原账目不会随衣物编辑改变。</p>':`<div class="field"><label for="purchase-mode">账单怎么处理</label><select id="purchase-mode" name="purchaseMode" onchange="setPurchaseMode(this.value)"><option value="NONE">不关联账单（旧衣、礼物）</option><option value="NEW">本次同时记账</option><option value="EXISTING">关联已有账单</option></select></div><div id="purchase-fields"></div>`}</section>`}
function setPurchaseMode(mode){const fields=document.getElementById('purchase-fields');fields.innerHTML=mode==='NEW'?`<div class="twocol"><div class="field"><label for="purchase-amount">本次支出金额（元）</label><input id="purchase-amount" name="purchaseAmount" type="number" required min="0.01" step="0.01" placeholder="如：299.00"></div><div class="field"><label for="purchase-date">消费日期</label><input id="purchase-date" name="expenseOn" type="date" required value="2026-10-20"></div></div><p class="info small" style="margin-bottom:18px">付款人：我 · 分类：服饰 · 归属：个人账本<br>确认一次，衣物和支出一起保存。</p>`:mode==='EXISTING'?`<div class="field"><label for="existing-expense">选择已有服饰支出</label><select id="existing-expense" name="existingExpense"><option value="purchase-1012">10 月 12 日 · 秋季衣物 · ¥369.00</option></select><small>复用原账单，不再记一笔支出；同笔支出可继续添加衣物。</small></div>`:'';document.getElementById('save-submit').textContent=mode==='NEW'?'保存衣物并记账':mode==='EXISTING'?'保存并关联账单':'保存衣物'}
function changeRecipient(owner){document.getElementById('owner-hint').textContent=owner==='other'?'衣物仅加入对方自己的衣柜；支出仍由我记录。':'衣物加入自己的衣柜。'}
function openEntry(id){const g=id?item(id):null;openDrawer(`<div class="drawhead"><h2 id="drawer-title">${g?'编辑衣物':'添加衣物'}</h2><button class="close" aria-label="关闭表单" onclick="closeDrawer()">×</button></div><form class="dialogform" onsubmit="saveEntry(event,${id||0})">${entryPurchaseFields(g)}<label class="upload" for="photo-file">${icon('camera')}<strong>拍照或上传单品照</strong><small>普通背景即可，无需提前抠图</small></label><input id="photo-file" type="file" accept="image/jpeg,image/png,image/webp" hidden onchange="previewFile(this)"><img class="entrypreview" id="entry-preview" ${g?.image?`src="${esc(g.image)}"`:'src="data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=" hidden'} alt="所选衣物"><button type="button" id="recognize-garment" class="button secondary full" style="margin-bottom:18px" onclick="recognizeGarment(this)">识别衣物信息</button><p id="recognition-status" class="small muted" style="margin-bottom:16px">可选用 AI 补全，也可以直接手填。</p><div class="field"><label for="entry-name">衣物名称</label><input id="entry-name" name="name" required maxlength="60" placeholder="如：燕麦色针织衫" value="${g?esc(g.name):''}"></div><div class="twocol"><div class="field"><label for="entry-cat">类别</label><select name="cat" id="entry-cat">${['上装','外套','下装','连衣裙','鞋','配饰'].map(c=>`<option ${g?.cat===c?'selected':''}>${c}</option>`).join('')}</select></div><div class="field"><label for="entry-color">主色</label><input id="entry-color" name="color" placeholder="可不填写" value="${g?g.color:''}"></div></div><fieldset class="season-field"><legend>适用季节</legend><div class="season-options">${seasonOrder.map(s=>`<label><input type="checkbox" name="seasons" value="${s}" ${seasonsOf(g?.seasons??g?.season).includes(s)?'checked':''}><span>${s}</span></label>`).join('')}</div><p class="small muted">可多选；不确定时可留空，标记为待补充。</p></fieldset><fieldset class="season-field"><legend>适用层次 · 可多选</legend><div class="season-options">${entryChecks("layers", ["贴身内搭", "中层", "外层"], g?.layers || [])}</div><p class="small muted">识别失败或不使用 AI 时，也可以手动选择。</p></fieldset><fieldset class="season-field"><legend>适用场景 · 可多选</legend><div class="season-options">${entryChecks("scenes", ["休闲", "通勤", "运动"], g?.scenes || [])}</div></fieldset><div class="field"><label for="entry-styling-advice">AI 穿搭建议</label><input id="entry-styling-advice" name="stylingAdvice" maxlength="80" placeholder="AI 识别后生成简短建议，也可以自行修改" value="${esc(g?.stylingAdvice??"")}"><small>后续穿搭推荐会把它作为搭配参考。</small></div><div class="field"><label for="entry-status">当前状态</label><select id="entry-status" name="status">${['可穿','清洗中','已收纳','已退役'].map(s=>`<option ${g?.status===s?'selected':''}>${s}</option>`).join('')}</select></div><div class="field"><label for="entry-location">收纳位置</label><input id="entry-location" name="location" placeholder="如：主卧衣柜上层" value="${g?esc(g.location):''}"></div><p class="small muted">你确认保存后，衣物才会加入衣柜。</p><footer><button class="button primary" id="save-submit" type="submit">保存衣物</button><button class="button quiet" type="button" onclick="closeDrawer()">取消</button></footer></form>`)}
function recognizeGarment(button){const preview=document.getElementById('entry-preview');if(preview.hidden){toast('请先选择一张衣物照片');return}button.disabled=true;button.textContent='正在识别…';setTimeout(()=>{button.disabled=false;button.textContent='重新识别';const advice=document.querySelector('[name="stylingAdvice"]');if(advice&&!advice.value)advice.value='适合日常通勤或休闲，可搭配简洁下装与轻薄外套。';document.getElementById('recognition-status').textContent='AI 草稿已填入，请核对后保存；穿搭建议可以手动修改。';},650)}
function previewFile(input){const f=input.files[0];if(!f)return;if(f.size>5*1024*1024){toast('请选择小于 5 MB 的图片');input.value='';return}const reader=new FileReader();reader.onload=()=>{const p=document.getElementById('entry-preview');p.src=reader.result;p.hidden=false};reader.readAsDataURL(f)}function saveEntry(e,id){e.preventDefault();const d=new FormData(e.target),old=item(id),p=document.getElementById('entry-preview');if(!old&&p.hidden){toast('请先选择一张衣物照片');return}const g={id:id||Date.now(),name:d.get('name').trim(),cat:d.get('cat'),color:d.get('color').trim()||'待补充',seasons:seasonsOf(d.getAll('seasons')),layers:d.getAll('layers'),scenes:d.getAll('scenes'),stylingAdvice:d.get('stylingAdvice').trim()||null,status:d.get('status'),owner:old?.owner||d.get('owner')||'self',acquiredOn:d.get('acquiredOn')||null,purchaseMode:old?.purchaseMode||d.get('purchaseMode')||'NONE',purchaseAmount:old?.purchaseAmount||d.get('purchaseAmount')||null,expenseOn:old?.expenseOn||d.get('expenseOn')||null,existingExpense:old?.existingExpense||d.get('existingExpense')||null,location:d.get('location'),fill:old?.fill||'#d3c3a8',shape:old?.shape||'knit',image:p.hidden?old?.image:p.src};if(!g.name)return;if(old)Object.assign(old,g);else clothes.unshift(g);try{persist()}catch(err){toast('图片较大，无法保存。请换一张较小的图片');return}closeDrawer();showTab('garments');toast(g.owner==='other'?'已保存给家人的录入信息':g.purchaseMode==='NEW'?'已保存衣物与支出的录入信息':'衣物已保存')}
function openLinked(type,id){const g=item(id);openDrawer(`<div class="drawhead"><h2 id="drawer-title">${type==='task'?'建立养护待办':'关联购买账目'}</h2><button class="close" aria-label="关闭" onclick="closeDrawer()">×</button></div>${type==='task'?`<div class="field"><label>待办标题</label><input value="送洗 · ${esc(g.name)}"></div><div class="field"><label>截止日期</label><input type="date" value="2026-10-25"></div><div class="field"><label>关联衣物</label><input value="${esc(g.name)}" readonly></div><p class="muted">待办将在现有“待办与提醒”中处理，完成时不会自动修改衣物状态。</p>`:`<h3>服饰支出</h3><div class="detailrow">秋季衣物 · 10 月 12 日 <span style="float:right">¥ 369.00</span></div><p class="small muted" style="margin-top:20px">只选择你有权查看的已有支出，不会新增消费。</p>`}<div class="actions"><button class="button secondary" onclick="closeDrawer()">返回衣物</button></div>`)}
document.addEventListener('keydown',e=>{if(!overlay.firstChild)return;if(e.key==='Escape')closeDrawer();if(e.key==='Tab'){const nodes=[...overlay.querySelectorAll('button,input:not([hidden]),select,[tabindex]')].filter(n=>!n.disabled&&n.getClientRects().length),first=nodes[0],last=nodes.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});render();if(state==='detail')openDetail(1);if(state==='entry'||state==='purchase'||state==='gift')openEntry();if(state==='purchase'||state==='gift'){document.getElementById('purchase-mode').value='NEW';setPurchaseMode('NEW')}if(state==='gift'){document.getElementById('entry-owner').value='other';changeRecipient('other')}
</script>
</body></html>
