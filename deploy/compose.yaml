name: homedata
services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?Set POSTGRES_APP_PASSWORD}
    volumes:
      - ${POSTGRES_DATA_DIR:-/home/docker/postgres}:/var/lib/postgresql
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [private]

  migrate:
    image: ${HOMEDATA_IMAGE:-homedata:latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.server
    command: ["./node_modules/.bin/prisma", "migrate", "deploy"]
    env_file: runtime.env
    depends_on: { db: { condition: service_healthy } }
    restart: "no"
    networks: [private]

  api:
    image: ${HOMEDATA_IMAGE:-homedata:latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.server
    command: ["node", "dist/src/main.js"]
    env_file: runtime.env
    depends_on:
      {
        db: { condition: service_healthy },
        migrate: { condition: service_completed_successfully },
      }
    restart: unless-stopped
    expose: ["3000"]
    volumes:
      - ${RECEIPTS_DATA_DIR:-/home/docker/homedata/receipts}:/data/receipts
    networks: [private]

  worker:
    image: ${HOMEDATA_IMAGE:-homedata:latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.server
    command: ["node", "dist/src/worker.js"]
    env_file: runtime.env
    depends_on:
      {
        db: { condition: service_healthy },
        migrate: { condition: service_completed_successfully },
      }
    restart: unless-stopped
    volumes:
      - ${RECEIPTS_DATA_DIR:-/home/docker/homedata/receipts}:/data/receipts
    networks: [private]

  web:
    image: ${HOMEDATA_WEB_IMAGE:-homedata-web:latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    restart: unless-stopped
    depends_on: [api]
    ports: ["${HTTP_PORT:-80}:80"]
    networks: [private]

networks:
  private:
    internal: false
